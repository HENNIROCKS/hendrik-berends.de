name: Website Carbon

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Measure page weight
        run: node site/plugins/kirby-website-carbon/scripts/measure.mjs https://hendrik-berends.de content/website-carbon.json

      - name: Upload result via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}/content/
          local-dir: ./content/
          protocol: ftp
