name: Website Carbon

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Measure page weight
        run: node site/plugins/kirby-website-carbon/scripts/measure.mjs https://hendrik-berends.de content/website-carbon.json

      # A single-file upload, deliberately not a folder sync: FTP-Deploy-Action
      # compares ./content/ against a remote state file and deletes whatever is
      # missing locally, which would wipe content edited in the Panel.
      - name: Upload result via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          dir="${FTP_SERVER_DIR#/}"
          dir="${dir%/}"
          curl --fail --show-error --silent --ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file content/website-carbon.json \
            "ftp://$FTP_SERVER/$dir/content/website-carbon.json"
