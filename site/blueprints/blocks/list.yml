name: field.blocks.list.name
icon: list-bullet
wysiwyg: true
preview: list

# A 1:1 copy of the core blueprint (kirby/config/blocks/list/list.yml) with an
# explicit `nodes` added. Without it no ordered list can be saved from the
# panel: the `list` field type defaults `nodes` to `null`, and `null` is
# dropped from the field props sent to the panel, so the node list never
# arrives there. The ul/ol buttons still show, only `<ol>` is discarded on
# save. Verified with Kirby 5.5.3.
#
# So do not delete this file while that core behaviour stands.
fields:
  text:
    label: field.blocks.list.name
    type: list
    nodes:
      - bulletList
      - orderedList
